$kind: http-request
name: Register
order: 1000
method: POST
url: '{{base_url}}/api/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{name}}",
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 201) {
          console.log("✅ Registration successful:", res.message);
          if (res.verification_url) {
              console.log("🔗 Verification URL:", res.verification_url);
          }
      } else {
          console.error("❌ Registration failed:", JSON.stringify(res));
      }
