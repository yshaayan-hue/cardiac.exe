{% extends "base.html" %}

{% block title %}Register — cardiac.exe{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <p style="font-family: var(--font-mono); font-size: 10px; color: var(--accent-pulse); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;">
                NEW COLLECTOR ENROLLMENT
            </p>
            <h2>CREATE ACCOUNT</h2>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 6px;">
                Join the collector registry to receive early access to future card drops.
            </p>
        </div>

        <div class="auth-tabs">
            <a href="{{ url_for('main.login') }}" class="auth-tab">LOGIN</a>
            <a href="{{ url_for('main.register') }}" class="auth-tab active">REGISTER</a>
        </div>

        <div id="authFeedback" class="auth-feedback"></div>

        <form id="registerForm" style="display: flex; flex-direction: column; gap: 18px;">
            <div class="form-group">
                <label for="name">FULL NAME</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="e.g. John Doe" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="collector@cardiac.exe" required>
            </div>

            <div class="form-group">
                <label for="password">PASSWORD (MINIMUM 8 CHARACTERS)</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" minlength="8" required>
            </div>

            <div style="margin-top: 10px;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 16px;">
                    REGISTER ACCOUNT →
                </button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
            Already registered? 
            <a href="{{ url_for('main.login') }}" style="color: var(--accent-pulse); font-weight: 700; text-decoration: underline;">
                Login here
            </a>
        </div>

    </div>
</div>

{% endblock %}
