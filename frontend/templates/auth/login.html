{% extends "base.html" %}

{% block title %}Login — cardiac.exe{% endblock %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <p style="font-family: var(--font-mono); font-size: 10px; color: var(--accent-pulse); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;">
                SECURITY CHECKPOINT
            </p>
            <h2>ACCESS VAULT</h2>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 6px;">
                Enter your credentials to manage your orders.
            </p>
        </div>

        <div class="auth-tabs">
            <a href="{{ url_for('main.login') }}" class="auth-tab active">LOGIN</a>
            <a href="{{ url_for('main.register') }}" class="auth-tab">REGISTER</a>
        </div>

        <div id="authFeedback" class="auth-feedback"></div>

        <form id="loginForm" style="display: flex; flex-direction: column; gap: 18px;">
            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="collector@cardiac.exe" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div style="margin-top: 10px;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 16px;">
                    LOGIN TO VAULT →
                </button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
            Don't have an account yet? 
            <a href="{{ url_for('main.register') }}" style="color: var(--accent-pulse); font-weight: 700; text-decoration: underline;">
                Register here
            </a>
        </div>

    </div>
</div>

{% endblock %}
