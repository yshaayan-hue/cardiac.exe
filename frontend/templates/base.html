<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}cardiac.exe{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <header class="navbar">

        <a
            href="{{ url_for('home') }}"
            class="logo"
        >
            cardiac.exe
        </a>


        <nav>

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('products') }}">
                Cards
            </a>

            <a href="{{ url_for('cart') }}">
                Cart
            </a>

        </nav>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            © 2026 cardiac.exe
        </p>

    </footer>


    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

</body>

</html>
